apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr
    spec:
      nodeSelector:
        iSCSI: "true"
        kubernetes.io/hostname: k3s-worker-02
        egress.network/internet: "true"
      imagePullSecrets:
        - name: image-registry-credentials
      terminationGracePeriodSeconds: 30
      containers:
        - name: radarr
          image: 192.168.50.222:32050/radarr/radarr@sha256:7dfd049e79c00b16fbc29c3f5d96a9e7b9e73a23930b4c5b3c4541d60b366814
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          env:
            - name: TZ
              value: America/Denver
            - name: PUID
              value: "555"
            - name: PGID
              value: "321"
            - name: UMASK
              value: "022"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: synology-radarr
        - name: data
          persistentVolumeClaim:
            claimName: synology-data
      tolerations:
        - key: dedicated
          operator: Equal
          value: internet-egress
          effect: NoSchedule
