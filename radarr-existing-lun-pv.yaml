apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-existing-lun
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: synology-iscsi-storage
  volumeMode: Filesystem
  claimRef:
    namespace: default
    name: synology-radarr
  csi:
    driver: csi.san.synology.com
    fsType: ext4
    volumeHandle: 9238a561-1bca-4116-97e5-6f7b378394e7
